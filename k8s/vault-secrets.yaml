# k8s/vault-secrets.yaml
# =========================================================
# PURPOSE: Kết nối K8s với HashiCorp Vault để inject secrets vào Pods.
#
# APPROACH OPTIONS (chọn 1):
#   Option A - Vault Agent Injector (Recommended Enterprise):
#     - Cài helm chart: hashicorp/vault với injector.enabled=true
#     - Annotate Deployment pods:
#         vault.hashicorp.com/agent-inject: "true"
#         vault.hashicorp.com/role: "customer-app"
#         vault.hashicorp.com/agent-inject-secret-config: "secret/data/customer-chatbot"
#     - Vault Agent sẽ mount secrets vào /vault/secrets/ như file text
#
#   Option B - External Secrets Operator (ESO):
#     - apiVersion: external-secrets.io/v1beta1
#       kind: ExternalSecret
#       metadata: name=customer-chatbot-secrets
#       spec:
#         refreshInterval: 1h
#         secretStoreRef: vault-backend
#         target: name=customer-chatbot-k8s-secret
#         data:
#           - secretKey: OPENAI_API_KEY
#             remoteRef: key=secret/data/customer-chatbot, property=OPENAI_API_KEY
#           - (similar cho các keys còn lại)
#
#   Option C - K8s Native Secret (Dev/Test only):
#     kubectl create secret generic customer-chatbot-secrets
#       --from-literal=OPENAI_API_KEY=sk-...
#     → Dùng cho development, KHÔNG commit vào Git
#
# RECOMMENDATION: Dùng Option A (Vault Agent Injector) cho production K8s deployment
# =========================================================
