# PURPOSE: Config để Grafana tự load dashboard JSON từ thư mục.
#
# WHAT TO CONFIGURE:
#   apiVersion: 1
#   providers:
#     - name: Default
#       orgId: 1
#       folder: ''
#       type: file
#       disableDeletion: false
#       updateIntervalSeconds: 30
#       allowUiUpdates: true
#       options:
#         path: /etc/grafana/provisioning/dashboards
#         foldersFromFilesStructure: true
#
# DASHBOARD JSON FILES CẦN TẠO (đặt cùng thư mục):
#   customer_chatbot_overview.json
