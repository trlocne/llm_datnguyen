# services/api-gateway/nginx.conf
# =========================================================
# PURPOSE: Nginx reverse proxy - single entry point port 80 cho toàn bộ hệ thống.
#
# WHAT TO CONFIGURE:
#   upstream frontend     → frontend:3000
#   upstream chat         → chat-service:8000
#   upstream customers    → customer-service:8000
#
#   server block port 80:
#     location /api/v1/chat/ {
#       proxy_pass http://chat;
#       proxy_buffering off;        ← QUAN TRỌNG: tắt buffering để SSE hoạt động
#       proxy_cache off;
#       proxy_set_header Connection '';
#       proxy_http_version 1.1;
#       chunked_transfer_encoding on;
#     }
#     location /api/v1/customers/ {
#       proxy_pass http://customers;
#     }
#     location / {
#       proxy_pass http://frontend;
#     }
#
#   CORS headers (nếu cần): add_header Access-Control-Allow-Origin *;
#   Client max body size: client_max_body_size 10m;
#
# NOTE: proxy_buffering off là bắt buộc cho SSE streaming LLM tokens!
# =========================================================
